[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexustrade-ai"
version = "1.0.0"
description = "Institutional-grade AI-powered Telegram Trading Bot with TradingView integration and multimodal intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "NexusTrade AI Quant Engineering" }
]
dependencies = [
    "aiogram>=3.10.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.1",
    "structlog>=24.2.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pyarrow>=16.1.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.41.0",
    "torch>=2.3.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["config*", "data_pipeline*", "ai_engine*", "tradingview*", "telegram_bot*"]
